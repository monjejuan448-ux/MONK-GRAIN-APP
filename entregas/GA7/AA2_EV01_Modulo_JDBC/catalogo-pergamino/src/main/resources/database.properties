# ============================================================
# Conexion JDBC del modulo de catalogo
# ============================================================
# Apunta a la base `monkgrain_java` del mismo PostgreSQL que usa
# la aplicacion, en una base propia: un modulo de aprendizaje que
# inserta y borra no debe tocar los datos de demostracion.
#
# Las variables de entorno MONKGRAIN_JDBC_URL, MONKGRAIN_JDBC_USER
# y MONKGRAIN_JDBC_PASSWORD tienen prioridad sobre estos valores.
#
# Credenciales de desarrollo. Las de un entorno real nunca van en
# un archivo versionado.
# ============================================================

db.url=jdbc:postgresql://localhost:5432/monkgrain_java
db.user=monkgrain
db.password=change_me_in_production
