# ============================================================
# Mensajes de error de conversion
# ============================================================
# Sin esto, escribir «abc» donde van los kilos produce un mensaje
# que nombra clases de Java —«Failed to convert property value of
# type java.lang.String to required type int»— y que no le dice al
# usuario que debe escribir un numero.
#
# La clave sigue el convenio de Spring: codigo.objeto.campo, de
# mas especifico a mas general.
# ============================================================

typeMismatch.int=Debe ser un número entero.
typeMismatch.java.lang.Integer=Debe ser un número entero.
typeMismatch.java.math.BigDecimal=Debe ser un número. Usa el punto para los decimales.
typeMismatch.java.time.LocalDate=La fecha debe tener el formato AAAA-MM-DD.
typeMismatch=El valor escrito no tiene el formato esperado.
