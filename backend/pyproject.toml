[project]
name = "monkgrain-api"
version = "0.1.0"
description = "API del marketplace de café MONK GRAIN"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Cada dependencia lleva techo de versión mayor. Sin él, una reconstrucción de
# la imagen traía versiones mayores nuevas sin que nada lo anunciara: SQLAlchemy
# 2.1 cambió la firma de `select()` y rompió el tipado de nueve archivos de una
# vez. En los paquetes 0.x el techo va en la minor, porque ahí es donde rompen.
#
# El techo evita el salto silencioso; la reproducibilidad exacta la da
# `requirements.lock`, que es el equivalente del `package-lock.json` del
# frontend. Al subir un techo conviene reconstruir la imagen y regenerar el
# lock en el mismo cambio.
dependencies = [
    "fastapi>=0.115,<0.142",
    "uvicorn[standard]>=0.32,<0.55",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0.36,<2.2",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<9",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.12,<0.1",
    "boto3>=1.35,<2",
    "jinja2>=3.1,<4",
    "weasyprint>=63.0,<71",
    "structlog>=24.4,<27",
    "httpx>=0.28,<0.29",
    # Cifrado simétrico de los datos bancarios del vendedor (Fernet). La columna
    # `bank_account_encrypted` existía desde el principio y los textos legales
    # prometían el cifrado, pero no había con qué cifrar.
    "cryptography>=44,<48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6.0,<8",
    "ruff>=0.8,<0.17",
    "mypy>=1.13,<3",
    "types-boto3<2",
    "faker>=33.0,<41",
    # Solo para las pruebas: permite leer el texto del comprobante generado y
    # comprobar que lleva lo que la ley exige, en vez de dar por bueno que el
    # archivo empieza por «%PDF».
    "pypdf>=5.1,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ------------------------------------------------------------
# Ruff — linting y formateo
# ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "S",    # bandit (seguridad)
    "T20",  # sin print()
]
ignore = [
    "B008",  # Depends() en argumentos por defecto es el patrón de FastAPI
    # `from sqlalchemy.dialects.postgresql import UUID as PgUUID` es el modismo
    # estándar para no chocar con `uuid.UUID`. La regla lo lee como constante.
    "N811",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert permitido en pruebas

[tool.ruff.format]
quote-style = "double"

# ------------------------------------------------------------
# Mypy — verificación de tipos
# ------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "weasyprint.*"]
ignore_missing_imports = true

# ------------------------------------------------------------
# Pytest
# ------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "unit: pruebas unitarias sin dependencias externas",
    "integration: pruebas que requieren base de datos",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/seed.py", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
