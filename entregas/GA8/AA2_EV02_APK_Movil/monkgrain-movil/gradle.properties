# 2 GB para el demonio de Gradle: con el valor de serie, la construcción de
# un proyecto Android se queda sin memoria a mitad de camino.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# AndroidX en lugar de las bibliotecas de soporte antiguas. Obligatorio hoy.
android.useAndroidX=true

# Sin esto, R genera un campo por cada recurso de CADA dependencia, y el
# conteo de métodos del DEX crece sin motivo.
android.nonTransitiveRClass=true
