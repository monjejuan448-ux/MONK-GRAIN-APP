# ============================================================
# MONK GRAIN — versiones exactas del backend
# ============================================================
# Equivalente de `package-lock.json` para Python: fija el árbol completo de
# dependencias, también las transitivas, para que la imagen se reconstruya igual
# hoy y en seis meses. Los rangos de `pyproject.toml` dicen qué es compatible;
# este archivo dice qué se instaló de verdad.
#
# El Dockerfile lo usa como fichero de restricciones (`pip install -c`), así que
# los extras y el modo editable siguen saliendo de `pyproject.toml`.
#
# Para regenerarlo tras cambiar una dependencia:
#   docker compose exec -T backend pip list --format=freeze \
#     | grep -v '^monkgrain-api' > backend/requirements.lock
#
# Generado el 1 de noviembre de 2026 desde la imagen en uso, con la suite en
# verde: 401 pruebas de backend.
