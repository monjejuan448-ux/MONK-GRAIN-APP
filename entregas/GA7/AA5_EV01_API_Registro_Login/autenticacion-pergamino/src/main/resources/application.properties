# ============================================================
# MONK GRAIN - Servicio de autenticacion
# GA7-220501096-AA5-EV01
# ============================================================

spring.application.name=autenticacion-pergamino

# 8082: el 8080 es de Tomcat con el modulo de catalogo (AA2-EV02) y el
# 8081 del modulo de negociacion (AA3-EV01). Los tres pueden convivir.
server.port=8082

# ---------- Base de datos ----------
# La misma base `monkgrain_java` que los otros modulos de la linea Java,
# y no la de la aplicacion: un modulo de aprendizaje que crea y borra
# cuentas no debe acercarse a los datos del producto.
spring.datasource.url=${MONKGRAIN_JDBC_URL:jdbc:postgresql://localhost:5432/monkgrain_java}
spring.datasource.username=${MONKGRAIN_JDBC_USER:monkgrain}
spring.datasource.password=${MONKGRAIN_JDBC_PASSWORD:change_me_in_production}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Serializacion ----------
# Sin esto las fechas viajan como arreglos de numeros en vez de texto ISO.
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Errores ----------
# Que no salga una traza de pila por la API: delata rutas, versiones y
# nombres de tablas. El manejador de errores responde un mensaje generico
# y escribe el detalle en la bitacora del servidor.
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Bitacora ----------
# Nivel INFO para el servicio: deja rastro de los registros repetidos y de
# los fallos, sin escribir una linea por consulta.
logging.level.co.monkgrain.authentication=INFO

# NUNCA subir a DEBUG el registro de parametros de Hibernate en un
# servicio de autenticacion: escribiria los correos en el disco.
logging.level.org.hibernate.SQL=WARN
