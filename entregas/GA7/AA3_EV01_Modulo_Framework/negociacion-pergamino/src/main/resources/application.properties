# ============================================================
# MONK GRAIN - Modulo de negociacion
# ============================================================

spring.application.name=negociacion-pergamino
server.port=8081

# ---------- Base de datos ----------
# La misma base que el modulo de catalogo (AA2-EV01): los dos son parte
# del mismo producto. Las tablas no chocan porque los nombres difieren.
spring.datasource.url=${MONKGRAIN_JDBC_URL:jdbc:postgresql://localhost:5432/monkgrain_java}
spring.datasource.username=${MONKGRAIN_JDBC_USER:monkgrain}
spring.datasource.password=${MONKGRAIN_JDBC_PASSWORD:change_me_in_production}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA ----------
# `update` y no `create-drop`: borrar las tablas en cada arranque haria
# imposible una demostracion con datos. En produccion se usarian
# migraciones versionadas, no la generacion automatica.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Serializacion ----------
# Sin esto, las fechas viajan como arreglos de numeros en vez de texto
# ISO, que es ilegible para quien consume la API.
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Plantillas ----------
spring.thymeleaf.cache=false

# ---------- Errores ----------
# Que una traza de pila no llegue al navegador: delata rutas y versiones.
server.error.include-stacktrace=never
server.error.include-message=always
