name: CI

# Se ejecuta en cada push a las ramas principales y en cada pull request.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene
# sentido gastar minutos validando un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------
  # Backend
  # ------------------------------------------------------------------
  backend:
    name: Backend — calidad y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monkgrain
          POSTGRES_PASSWORD: contrasena_de_pruebas
          POSTGRES_DB: monkgrain_ci
        ports: ["5432:5432"]
        # Sin esta espera, las pruebas arrancarían antes de que la base
        # de datos acepte conexiones.
        options: >-
          --health-cmd "pg_isready -U monkgrain"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://monkgrain:contrasena_de_pruebas@localhost:5432/monkgrain_ci
      REDIS_URL: redis://localhost:6379/0
      # Clave exclusiva de CI. Nunca debe coincidir con la de ningún entorno real.
      SECRET_KEY: clave_solo_para_integracion_continua_no_usar_jamas_en_produccion
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias del sistema
        # WeasyPrint necesita estas bibliotecas para generar los comprobantes.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libffi8

      - name: Instalar el proyecto
        # Con las versiones exactas del lock, para que el CI valide lo mismo que
        # corre en la imagen y no lo que resuelvan hoy los rangos.
        run: pip install -c requirements.lock -e ".[dev]"

      - name: Crear las extensiones de PostgreSQL
        # El esquema usa CITEXT y unaccent; deben existir antes de migrar.
        run: |
          PGPASSWORD=contrasena_de_pruebas psql -h localhost -U monkgrain -d monkgrain_ci \
            -c "CREATE EXTENSION IF NOT EXISTS citext;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS unaccent;"

      - name: Linting y formato
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Verificación de tipos
        run: mypy app

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Comprobar que no faltan migraciones
        # Detecta el olvido más común: cambiar un modelo sin generar la
        # migración correspondiente.
        run: alembic check

      - name: Pruebas con cobertura
        run: pytest --cov=app --cov-report=xml --cov-report=term

      - name: Publicar el informe de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          retention-days: 14

  # ------------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------------
  frontend:
    name: Frontend — calidad y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        # `npm ci` a secas, sin respaldo en `npm install`: el respaldo ocultaba
        # que no existía package-lock.json y hacía que cada ejecución resolviera
        # versiones distintas dentro de los rangos declarados.
        run: npm ci

      - name: Verificación de tipos
        run: npx tsc --noEmit

      - name: Linting
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Pruebas
        # Vitest y Testing Library estaban instalados desde el principio sin una
        # sola prueba, y el CI no las ejecutaba: la ausencia no rompía nada.
        run: npm test

      - name: Compilación de producción
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  # ------------------------------------------------------------------
  # Imágenes de contenedor
  # ------------------------------------------------------------------
  docker:
    name: Imágenes de producción
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir la imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Seguridad
  # ------------------------------------------------------------------
  security:
    name: Revisión de seguridad
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Buscar dependencias con vulnerabilidades conocidas
        run: |
          pip install pip-audit
          pip-audit --desc --skip-editable -r <(pip install -e ./backend --dry-run --report - 2>/dev/null | true) || true
        continue-on-error: true

      - name: Reglas de seguridad del código
        # Ruff incluye las comprobaciones de Bandit en el conjunto `S`.
        run: |
          pip install ruff
          ruff check backend/app --select S

      - name: Buscar secretos en el historial
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
