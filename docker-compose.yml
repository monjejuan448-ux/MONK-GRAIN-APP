# ============================================================
# MONK GRAIN — Entorno de desarrollo
# Arranque:  cp .env.example .env  &&  docker compose up --build
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: monkgrain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [monkgrain]

  redis:
    image: redis:7-alpine
    container_name: monkgrain_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [monkgrain]

  # Almacenamiento compatible con S3 para imágenes y documentos
  minio:
    image: minio/minio:latest
    container_name: monkgrain_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [monkgrain]

  # Captura los correos salientes en desarrollo (no los envía)
  mailpit:
    image: axllent/mailpit:latest
    container_name: monkgrain_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interfaz web
    networks: [monkgrain]

  backend:
    build:
      context: ./backend
      target: development
    container_name: monkgrain_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
      - ./backend/alembic.ini:/app/alembic.ini
      # Montado para que ruff y pytest lean la configuración vigente sin
      # necesidad de reconstruir la imagen en cada ajuste.
      - ./backend/pyproject.toml:/app/pyproject.toml
    # MinIO no figura aquí a propósito: el backend solo lo contacta al subir un
    # archivo, no al arrancar. Declararlo como dependencia obligaría además a
    # mantenerlo en producción, donde el almacenamiento es un servicio externo.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [monkgrain]

  web:
    build:
      context: ./web
      target: development
    container_name: monkgrain_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Desde el servidor de Next.js la API se alcanza por el nombre del
      # servicio en la red de Docker, no por localhost.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks: [monkgrain]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  monkgrain:
    driver: bridge
