[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# La URL real se toma de la variable de entorno DATABASE_URL en migrations/env.py.
# Aquí se deja vacía deliberadamente para no versionar credenciales.
sqlalchemy.url =

[post_write_hooks]
# Se usa `exec` en lugar de `console_scripts` porque ruff se distribuye como
# binario y no expone un entry point de setuptools que Alembic pueda resolver.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
