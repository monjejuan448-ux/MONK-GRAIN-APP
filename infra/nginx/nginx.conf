# ============================================================
# MONK GRAIN — Proxy reverso (producción)
# En desarrollo no se usa: web y backend se exponen directamente.
# ============================================================

upstream monkgrain_backend {
    server backend:8000;
}

upstream monkgrain_web {
    server web:3000;
}

# Límites de peticiones por IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    # Redirección a HTTPS (activar cuando el certificado esté instalado)
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # ---------- Cabeceras de seguridad ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---------- Compresión ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # ---------- API ----------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://monkgrain_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Límite más estricto en autenticación (protección contra fuerza bruta)
    location ~ ^/api/v1/auth/(login|register|password-reset) {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://monkgrain_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs { proxy_pass http://monkgrain_backend; }
    location /openapi.json { proxy_pass http://monkgrain_backend; }
    location /health { proxy_pass http://monkgrain_backend; access_log off; }

    # ---------- Frontend ----------
    location / {
        proxy_pass http://monkgrain_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
